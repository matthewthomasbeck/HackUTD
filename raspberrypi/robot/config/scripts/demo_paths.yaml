# Scripted paths and demo waypoints (docs/specs/robot.md sections 8 and 15).
# Coordinates are copied from backend/sim/demo-site.json (equirectangular offsets from the site center) so the robot and the simulator agree.
anchor: { lat: 32.996746, lon: -96.7704579 }   # demo_anchor: house 3 front door
waypoints:
  home:    { lat: 32.9966948, lon: -96.7704708 }   # sim robot home
  house_3: { lat: 32.9968808, lon: -96.7704579, label: "house 3" }
paths:
  - name: home_to_house_3
    start: home
    end: house_3
    cells: [3]                            # search_cell ids or labels this path covers
    steps:
      - { drive: { vx: 0.15, vy: 0, wz: 0, seconds: 4 } }
      - { turn_to: { heading_deg: 90 } }
      - { scan: { seconds: 10, mode: rotate } }
